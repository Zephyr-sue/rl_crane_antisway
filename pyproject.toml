[project]
name = "rl-crane-antisway"
version = "0.1.0"
description = "RL anti-sway control of a double-pendulum overhead crane (GRPO vs PPO/SAC)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.5",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "pandas>=2.1",
    "tensorboard>=2.15",
    "tqdm>=4.66",
    "rich>=13.0",
]

[project.optional-dependencies]
viz = ["pygame>=2.5", "plotly>=5.18"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
